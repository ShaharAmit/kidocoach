<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(145deg, #f4fcfd 0%, #caedf3 55%, #77c4d7 100%);
    font-family: 'Baloo 2', 'Nunito', sans-serif;
    display: flex;
    align-items: stretch;
    position: relative;
  }
  .blob1 { position: absolute; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,211,99,0.38); top: -50px; left: -50px; }
  .blob2 { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: rgba(67,163,190,0.16); bottom: -80px; left: 380px; }
  .blob3 { position: absolute; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,211,99,0.2); top: 40px; right: 500px; }

  .left {
    flex: 0 0 620px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 48px 64px 72px;
    position: relative;
    z-index: 1;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
  }
  .chip {
    width: 60px; height: 60px; border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(26,89,110,0.25);
  }
  .chip img {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  .brand-name {
    font-size: 32px; font-weight: 800; color: #173d4b;
    letter-spacing: -0.5px;
  }
  .eyebrow {
    display: inline-block;
    align-self: flex-start;
    background: rgba(204,239,246,0.92);
    color: #175b73;
    font-size: 16px; font-weight: 700;
    padding: 6px 18px; border-radius: 20px;
    margin-bottom: 18px;
    font-family: 'Nunito', sans-serif;
    letter-spacing: 0.3px;
  }
  h1 {
    font-size: 52px; font-weight: 800; color: #173d4b;
    line-height: 1.12; letter-spacing: -1.5px;
    margin-bottom: 18px;
  }
  .sub {
    font-size: 19px; font-weight: 600; color: #386373;
    line-height: 1.55;
    font-family: 'Nunito', sans-serif;
    max-width: 440px;
  }

  .right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 38px 44px 38px 20px;
    position: relative;
    z-index: 1;
  }
  .avatar-frame {
    width: auto; height: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(26,89,110,0.22), 0 2px 8px rgba(26,89,110,0.12);
    position: relative;
    background: #caedf3;
  }
  .avatar-frame img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 15%;
    display: block;
  }
  .avatar-badge {
    position: absolute;
    bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(248,253,254,0.93);
    color: #173d4b;
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 800;
    padding: 6px 18px; border-radius: 20px;
    white-space: nowrap;
    letter-spacing: 0.1px;
    box-shadow: 0 2px 10px rgba(26,89,110,0.15);
  }
</style>
</head>
